name: build

on:
  push:
    branches: [master, main, dev]
  workflow_dispatch:

jobs:
  build:
    name: linux-x86
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build/ci-linux-x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Zig
        shell: bash
        run: |
          ZIG_VERSION=0.17.0
          ZIG_DIR="$HOME/.local/zig"
          mkdir -p "$ZIG_DIR"
          curl -fsSL --retry 3 -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xJ -f /tmp/zig.tar.xz -C "$ZIG_DIR" --strip-components=1
          echo "$ZIG_DIR" >> $GITHUB_PATH
          "$ZIG_DIR/zig" version

      - name: Restore Zig cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: zig-cache-0.17.0-linux-x86

      - name: Configure
        run: cmake --preset ci-linux-x86

      - name: Build
        run: cmake --build --preset ci-linux-x86

      - name: Check ABI (i386)
        shell: bash
        run: |
          so=$(ls $BUILD_DIR/ | grep -E '^yapb.*\.so$' | grep -v 'amxx' | head -1)
          python3 tools/check_abi.py "$BUILD_DIR/$so" --arch i386 --max-glibc 2.17

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86
          path: ${{ env.BUILD_DIR }}/yapb*.so
          if-no-files-found: error
